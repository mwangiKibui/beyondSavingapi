services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-beyondsaving}:${POSTGRES_PASSWORD:-beyondsaving}@postgres:5432/${POSTGRES_DB:-beyondsaving}
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-storageadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-storageadmin}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      SUGGESTION_KEY_SECRET: ${SUGGESTION_KEY_SECRET:-dev-suggestion-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - ./app:/srv/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-beyondsaving}:${POSTGRES_PASSWORD:-beyondsaving}@postgres:5432/${POSTGRES_DB:-beyondsaving}
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-storageadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-storageadmin}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      SUGGESTION_KEY_SECRET: ${SUGGESTION_KEY_SECRET:-dev-suggestion-secret-change-me}
    volumes:
      - ./app:/srv/app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    image: migrate/migrate:v4.18.1
    volumes:
      - ../beyondSavingdb/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgresql://${POSTGRES_USER:-beyondsaving}:${POSTGRES_PASSWORD:-beyondsaving}@postgres:5432/${POSTGRES_DB:-beyondsaving}?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beyondsaving}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beyondsaving}
      POSTGRES_DB: ${POSTGRES_DB:-beyondsaving}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beyondsaving}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local stand-in for DigitalOcean Spaces (test/prod). Any S3-compatible
  # store works; MinIO's images stopped being published in 2026 (ab-263).
  storage:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-storageadmin}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-storageadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${STORAGE_API_PORT:-9000}:9000"
      - "${STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  storage_data:
